<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Loading</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-app-region: drag;
        cursor: default;
      }

      .splash {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;

        border-radius: 14px;
        background: linear-gradient(160deg, #6a6a83 0%, #5a5a70 55%, #52526a 100%);
        border: 1px solid rgba(255, 255, 255, 0.09);
        color: #ffffff;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;

        opacity: 0;
        animation: splash-in 260ms ease forwards;
        transition: opacity 300ms ease;
      }

      .splash.is-exiting {
        opacity: 0;
        animation: none;
      }

      .splash-mark-wrap {
        width: 88px;
        height: 88px;
        overflow: hidden;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .splash-mark {
        width: 240px;
        height: 240px;
        object-fit: contain;
        mix-blend-mode: screen;
      }

      .splash-name {
        margin: 0;
        color: #ffffff;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .splash-loader {
        margin-top: 34px;
        width: 52px;
        height: 52px;
        color: rgba(255, 255, 255, 0.92);
        flex-shrink: 0;
      }

      @keyframes splash-in {
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-loader animate {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash" id="splash">
      <div class="splash-mark-wrap">
        <img class="splash-mark" src="./assets/viszmo-mark.png" alt="" aria-hidden="true" />
      </div>

      <svg
        class="splash-loader"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        role="status"
        aria-label="Loading"
      >
        <path d="M 12 8 C 14.21 8 16 9.79 16 12 C 16 14.21 14.21 16 12 16 C 9.79 16 8 14.21 8 12 C 8 9.79 9.79 8 12 8 Z">
          <animate
            attributeName="d"
            dur="5s"
            repeatCount="indefinite"
            calcMode="spline"
            keyTimes="0;0.25;0.5;0.75;1"
            keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
            values="M 12 8 C 14.21 8 16 9.79 16 12 C 16 14.21 14.21 16 12 16 C 9.79 16 8 14.21 8 12 C 8 9.79 9.79 8 12 8 Z;M 12 12 C 14 8.5 19 8.5 19 12 C 19 15.5 14 15.5 12 12 C 10 8.5 5 8.5 5 12 C 5 15.5 10 15.5 12 12 Z;M 12 16 C 14.21 16 16 14.21 16 12 C 16 9.79 14.21 8 12 8 C 9.79 8 8 9.79 8 12 C 8 14.21 9.79 16 12 16 Z;M 12 12 C 14 8.5 19 8.5 19 12 C 19 15.5 14 15.5 12 12 C 10 8.5 5 8.5 5 12 C 5 15.5 10 15.5 12 12 Z;M 12 8 C 14.21 8 16 9.79 16 12 C 16 14.21 14.21 16 12 16 C 9.79 16 8 14.21 8 12 C 8 9.79 9.79 8 12 8 Z"
          />
        </path>
      </svg>
    </div>
  </body>
</html>
