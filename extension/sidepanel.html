<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Web Copilot</title>
  <style>
    html, body, iframe { margin: 0; padding: 0; width: 100%; height: 100%; border: 0; }
    body { background: #f8fafc; font-family: Segoe UI, sans-serif; }
    #fallback { display: none; padding: 20px; color: #334155; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <iframe id="frame" src="http://127.0.0.1:8000/?mode=sidepanel" title="Web Copilot"></iframe>
  <div id="fallback">
    Start the copilot server first, then reopen this panel:
    <pre>python agent_server.py --desktop</pre>
  </div>
  <script>
    const frame = document.getElementById("frame");
    const fallback = document.getElementById("fallback");
    fetch("http://127.0.0.1:8000/health").then((res) => {
      if (!res.ok) throw new Error("down");
    }).catch(() => {
      frame.style.display = "none";
      fallback.style.display = "block";
    });
  </script>
</body>
</html>
