<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Viszmo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #131314; }
    button {
      width: 100%; height: 100%; border: none; cursor: pointer;
      background: #1a1a1b;
      display: flex; align-items: center; justify-content: center;
      border-radius: 12px; padding: 6px;
    }
    button:hover { background: #252528; filter: brightness(1.1); }
    button img { width: 100%; height: 100%; object-fit: contain; display: block; }
  </style>
</head>
<body>
  <button type="button" title="Show Viszmo" onclick="showSidebar()" aria-label="Show Viszmo">
    <img src="/assets/viszmo.png" alt="Viszmo">
  </button>
  <script>
    function showSidebar() {
      if (window.pywebview && window.pywebview.api && window.pywebview.api.show) {
        window.pywebview.api.show();
      }
    }
  </script>
</body>
</html>
